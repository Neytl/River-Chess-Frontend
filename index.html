<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>River Chess</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href='css/siteStyles.css' rel='stylesheet' type='text/css'>
    <link href='css/home.css' rel='stylesheet' type='text/css'>
    <link href='css/stones.css' rel='stylesheet' type='text/css'>
    <link href='css/timeControlButtons.css' rel='stylesheet' type='text/css'>
    <link href='css/hoverPopup.css' rel='stylesheet' type='text/css'>
    <link rel="icon" type="image/png" sizes="32x32" href="imgs/favicon.png">
</head>
<body>

    <!-- =========================
         SIDE MENU
    ========================== -->

    <div id="menuOverlay" class="menu-overlay"></div>

    <aside id="sideMenu" class="side-menu">

        <div class="side-menu-header">
            <h2>Menu</h2>

            <button id="closeMenuButton"
                    class="close-menu-button"
                    aria-label="Close menu">
                ×
            </button>
        </div>

        <!-- Empty for now -->

    </aside>


    <!-- =========================
         TOP NAVIGATION
    ========================== -->

    <nav class="top-nav">

        <button id="menuButton"
                class="nav-button hidden"
                aria-label="Open menu">

            <span></span>
            <span></span>
            <span></span>

        </button>

        <div id="logoContainer">
            <img src="imgs/logo.png" />
        </div>

        <a href="/index.html"
           class="home-button hidden"
           aria-label="Home">

            🏠

        </a>

    </nav>

    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="river-page">

        <div class="river-container">

            <div class="river-panel" id="accountInfo">
                <div id="playerIcon">

                    <!--<div class="mini-stones-display">
                        <div class="stone-wrapper stone-white">
                            <img class="stone-image" src="/imgs/stones/Rubber Ducky.webp" alt="Stone">
                        </div>
                    </div>-->

                    <img class="pieceImage" src="imgs/pieces/white_king.png" />

                </div>
                <div>
                    <div id="playerName">...</div>
                    <div id="globalRankLine"><span>Global Rank #</span><span id="globalRank">?</span></div>
                </div>
            </div>


            <div class="river-panel">
                <div class="game-mode-panel-header">
                    <div>

                        <!--<div class="mini-stones-display">
                            <div class="stone-wrapper stone-white">
                                <img class="stone-image" src="/imgs/stones/Rubber Ducky.webp" alt="Stone">
                            </div>
                        </div>-->

                        <h2 id="gameModesTitle">Game Modes</h2>
                    </div>

                </div>

                <!--One Stone Duel-->
                <div id="duelsGameModes">
                    <div class="game-mode-button duels-game-button" data-game-mode="OneStoneDuel">
                        <div>
                            <img src="imgs/icons/OneStoneDuel.png" />
                            <div class="game-mode-title">1 Stone Duel</div>
                        </div>
                        <div class="elo-container">
                            <div>Elo</div>
                            <div>
                                <span>????</span>
                            </div>
                        </div>
                    
                        <div class="help-container">
                            <div class="help-button hover-popup-parent">
                                <img src="imgs/icons/info.png" />
                                <div class="hover-popup">
                                    <strong>1 Stone Duel</strong>
                                    <div>
                                        <span>A game of chess with one random additional rule in place</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!--Three Stone Duel-->
                    <div class="game-mode-button duels-game-button" data-game-mode="ThreeStoneDuel">
                        <div>
                            <img src="imgs/icons/ThreeStoneDuel.png" />
                            <div class="game-mode-title">3 Stone Duel</div>
                        </div>
                        <div class="elo-container">
                            <div>Elo</div>
                            <div>
                                <span>????</span>
                            </div>
                        </div>

                        <div class="help-container">
                            <div class="help-button hover-popup-parent">
                                <img src="imgs/icons/info.png" />
                                <div class="hover-popup">
                                    <strong>3 Stone Duel</strong>
                                    <div>
                                        <span>A game of chess with 3 random additional rules in place</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!--Disabled Game Modes-->
                    <div class="hidden game-mode-button duels-game-button" data-game-mode="TwoStoneDuel">
                        <div>
                            <img src="imgs/icons/TwoStoneDuel.png" />
                            <div class="game-mode-title">2 Stone Duel</div>
                        </div>
                        <div class="elo-container">
                            <div>Elo</div>
                            <div>
                                <span>????</span>
                            </div>
                        </div>
                    </div>

                    <div class="game-mode-button duels-game-button hidden" data-game-mode="Downstream">
                        <div>
                            <img src="imgs/icons/Downstream.png" />
                            <div class="game-mode-title">Downstream</div>
                        </div>
                        <div class="elo-container">
                            <div>Elo</div>
                            <div>
                                <span>????</span>
                            </div>
                        </div>
                    </div>

                    <!--                        <div class="hover-popup">
        <strong>Downstream</strong>
        <div>
            <span>An asymettrical game of chess where each player is given rules based on their skill level</span>
        </div>
    </div>-->

                </div>
            </div>

            <a href="/encyclopedia" class="river-panel" id="encyclopediaLink">
                <h2>Encyclopedia</h2>
                <div class="mini-stones-display">
                    <div class="stone-wrapper stone-white">
                        <img class="stone-image" src="/imgs/stones/Wizards Hat.webp" alt="Stone">
                    </div>
                    <div class="stone-wrapper stone-black">
                        <img class="stone-image" src="/imgs/stones/Lucky Clover.webp" alt="Stone">
                    </div>
                    <div class="stone-wrapper stone-white">
                        <img class="stone-image" src="/imgs/stones/Rubber Ducky.webp" alt="Stone">
                    </div>
                    <div class="stone-wrapper stone-black">
                        <img class="stone-image" src="/imgs/stones/Maple Leaf.webp" alt="Stone">
                    </div>
                </div>
            </a>

        </div>


        <!--Time Control-->
        <div class="option-menu" id="optionMenu">

            <div class="option-list">

                <button class="option-button" data-option="option1">
                    <div>Rapid</div>
                    <img src="imgs/icons/Rapid.png" />
                </button>

                <button class="option-button" data-option="option2">
                    <div>Blitz</div>
                    <img src="imgs/icons/Blitz.png" />
                </button>

                <button class="option-button" data-option="option3">
                    <div>Bullet</div>
                    <img src="imgs/icons/Bullet.png" />
                </button>

            </div>

            <button class="main-option" id="mainOption">
                <div>Untimed</div>
                <img src="imgs/icons/Untimed.png" />
            </button>

        </div>

    </main>

    <script src="js/utility.js"></script>
    <script src="js/loadAccountAndRun.js"></script>
    <script src="js/home.js"></script>
    <script src="js/stones.js"></script>
    <script src="js/sideMenu.js"></script>
    <script src="lib/signalr/signalr.min.js"></script>
    <script src="js/multiplayerClient.js"></script>
    <script src="js/timeControlButtons.js"></script>
    <script src="js/hoverPopup.js"></script>
</body>
</html>
