<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>River Chess</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href='css/siteStyles.css' rel='stylesheet' type='text/css'>
    <link href='css/play.css' rel='stylesheet' type='text/css'>
    <link href='css/playMobile.css' rel='stylesheet' type='text/css'>
    <link href='css/stones.css' rel='stylesheet' type='text/css'>
    <link href='css/chessStyles.css' rel='stylesheet' type='text/css'>
    <link rel="icon" type="image/png" sizes="32x32" href="imgs/favicon.png">
</head>
<body>
    <div id="wavesContainer">
        <div class="wave-container background"></div>
        <div class="wave-container wave-5">
            <div class="wave-fill"></div>
            <svg data-name="Layer 1" xmlns="http://w3.org" viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" class="shape-fill"></path>
            </svg>
        </div>
        <div class="wave-container wave-4">
            <div class="wave-fill"></div>
            <svg data-name="Layer 1" xmlns="http://w3.org" viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" class="shape-fill"></path>
            </svg>
        </div>
        <div class="wave-container wave-3">
            <div class="wave-fill"></div>
            <svg data-name="Layer 1" xmlns="http://w3.org" viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" class="shape-fill"></path>
            </svg>
        </div>
        <div class="wave-container wave-2">
            <div class="wave-fill"></div>
            <svg data-name="Layer 1" xmlns="http://w3.org" viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" class="shape-fill"></path>
            </svg>
        </div>
        <div class="wave-container wave-1">
            <div class="wave-fill"></div>
            <svg data-name="Layer 1" xmlns="http://w3.org" viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" class="shape-fill"></path>
            </svg>
        </div>
    </div>

    <!-- =========================
         SIDE MENU
    ========================== -->

    <div id="menuOverlay" class="menu-overlay"></div>

    <aside id="sideMenu" class="side-menu">

        <div class="side-menu-header">
            <h2>Menu</h2>

            <button id="closeMenuButton"
                    class="close-menu-button"
                    aria-label="Close menu">
                ×
            </button>
        </div>

        <!-- Empty for now -->

    </aside>


    <!-- =========================
         TOP NAVIGATION
    ========================== -->

    <nav class="top-nav">

        <button id="menuButton"
                class="nav-button hidden"
                aria-label="Open menu">

            <span></span>
            <span></span>
            <span></span>

        </button>

        <button id="drawOfferButton"
                class="nav-button">
            <img src="imgs/icons/draw.png" />
            <img id="drawNotication" src="imgs/icons/notification.png" />
        </button>


        <div id="logoContainer">
            <img src="imgs/logo.png" />
        </div>

        <button id="resignButton"
                class="nav-button">
            <img src="imgs/icons/resign.png" />
        </button>

        <a id="homeButton" href="/index.html"
           class="home-button hidden"
           aria-label="Home">

            🏠

        </a>
    </nav>

    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="river-page">
        <!--Opponent Stones-->
        <div id="opponentStonesContainer" class="stones-container"></div>

        <!--Chess!-->
        <div id="chessContainer">

        </div>

        <!--Player Stones-->
        <div id="playerStonesContainer" class="stones-container"></div>

        <!--Game Over Popup-->
        <div id="gameOverPopupContainer" class="hidden">
            <div id="gameOverPopup">
                <div id="closeGameOverPopupButton">&times;</div>
                <img id="gameOverPopupGameModeIcon" src="imgs/icons/duels.png" />
                <div id="gameOverMessageContainer">
                    <div id="gameOverTitle">You Won!</div>
                    <div id="gameOverSubtitle">by Checkmate</div>
                </div>

                <div id="gameOverPopupInfoSection">
                    <div class="elo-container">
                        <div><span id="timeControlDisplay">Blitz</span><span> Elo</span></div>
                        <div>
                            <img src="imgs/pieces/white_knight.png" />
                            <span id="eloContainer">????</span>
                            <span id="eloChange">+26</span>
                        </div>
                    </div>
                </div>
                <div id="gameOverPopupButtons">
                    <a href="/" id="gameOverHomeButton">Home</a>
                    <div id="newGameButton">New Game</div>
                </div>
            </div>
        </div>
    </main>


    <script src="js/utility.js"></script>
    <script src="js/loadAccountAndRun.js"></script>
    <script src="js/play.js"></script>
    <script src="js/stones.js"></script>
    <script src="js/sideMenu.js"></script>
    <script src="lib/signalr/signalr.min.js"></script>
    <script src="js/multiplayerClient.js"></script>
    <script src="js/chess.js"></script>
    <script src="js/chessClock.js"></script>
</body>
</html>
